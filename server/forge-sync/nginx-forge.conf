# nginx server block for the Forge sync API. Installed to /etc/nginx/sites-available/forge and
# symlinked into sites-enabled. Starts HTTP-only so certbot's HTTP-01 challenge can run; certbot
# --nginx then adds the 443 block and the redirect.
server {
    listen 80;
    server_name forge.mooo.com;

    # Snapshots are small (tens of KB today; the app caps at 8 MB server-side).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
