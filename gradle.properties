org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Pins the JDK Gradle uses for this project specifically, so JAVA_HOME being unset in a given
# terminal (or a fresh Android Studio restart) can't break the build. Points at Android Studio's
# bundled JBR — forward slashes are used because this is a Java .properties file, where a backslash
# is an escape character.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
