org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Do NOT add org.gradle.java.home here. The daemon's JDK is chosen by gradle/gradle-daemon-jvm.properties
# (JetBrains 21, found in ~/.jdks locally and auto-provisioned on CI via the foojay resolver in
# settings.gradle.kts). A java.home pin at Android Studio's bundled JBR looked harmless but that JBR
# is Java 25, which Gradle 8.13's Kotlin DSL compiler cannot run on — the pin was only ever ignored,
# and a Windows path here also breaks every Linux CI runner. The wrapper script still needs a JAVA_HOME
# (or java on PATH) to launch at all; that is a system setting, not a Gradle one.
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
