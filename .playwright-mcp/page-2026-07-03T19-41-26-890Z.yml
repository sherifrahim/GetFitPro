- generic [ref=f4e2]: "{\"success\":true,\"meta\":{\"total\":1500,\"hasNextPage\":true,\"hasPreviousPage\":false,\"nextCursor\":\"01qpYSe\"},\"data\":[{\"exerciseId\":\"01qpYSe\",\"name\":\"upward facing dog\",\"gifUrl\":\"https://static.exercisedb.dev/media/01qpYSe.gif\",\"bodyParts\":[\"back\"],\"equipments\":[\"body weight\"],\"targetMuscles\":[\"spine\"],\"secondaryMuscles\":[\"shoulders\",\"chest\"],\"instructions\":[\"Step:1 Lie face down on the floor with your legs extended behind you.\",\"Step:2 Place your hands on the floor next to your lower ribs, fingers pointing forward.\",\"Step:3 Press your hands firmly into the floor and straighten your arms, lifting your torso and thighs off the ground.\",\"Step:4 Roll your shoulders back and down, opening your chest and lifting your gaze towards the ceiling.\",\"Step:5 Hold this position for a few breaths, then slowly lower your body back down to the starting position.\",\"Step:6 Repeat for the desired number of repetitions.\"]}]}"