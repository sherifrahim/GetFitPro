# Daemon JVM criteria — LOAD-BEARING, do not delete. Gradle 8.13 must run its daemon on a JDK <= 23:
# its embedded Kotlin DSL compiler fails on newer ones with a bare "IllegalArgumentException: 25.0.3".
# Android Studio's bundled JBR is Java 25, so without this file the daemon would land on it and every
# build.gradle.kts compile would fail. Locally Gradle finds ~/.jdks/jbr-21.0.11 (installed by Studio);
# on CI setup-java provides a 21 and the foojay resolver in settings.gradle.kts can provision one.
# Vendor is intentionally unconstrained: any JDK 21 works, and pinning "jetbrains" only made CI harder.
toolchainVersion=21
